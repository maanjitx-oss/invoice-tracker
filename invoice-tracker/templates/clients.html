{% extends "base.html" %}
{% block title %}Clients · Invoice Tracker{% endblock %}
{% block content %}
<div class="pagehead"><div><h1>Clients</h1><p>Manage your customer list.</p></div></div>
<div class="card">
  <form class="inline-form" method="post">
    <input name="name" placeholder="Client name" required>
    <input name="email" type="email" placeholder="Email">
    <button class="primary">Add client</button>
  </form>
</div>
<div class="card">
  <form class="inline-form" method="get">
    <input name="q" value="{{ q }}" placeholder="Search name or email">
    <button>Search</button>
  </form>
  <table><thead><tr><th>Name</th><th>Email</th><th>Action</th></tr></thead>
  <tbody>
  {% for client in clients %}
  <tr><td>{{ client.name }}</td><td>{{ client.email or "—" }}</td><td>
    <form method="post" action="{{ url_for('delete_client', client_id=client.id) }}" onsubmit="return confirm('Delete this client and invoices?')">
      <button class="danger">Delete</button>
    </form>
  </td></tr>
  {% else %}<tr><td colspan="3">No clients found.</td></tr>{% endfor %}
  </tbody></table>
</div>
{% endblock %}
