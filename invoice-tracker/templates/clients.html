{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-3">Clients</h1>
<form method="post" class="row g-2 mb-4">
  <div class="col-md-4"><input name="name" class="form-control" placeholder="Client name" required></div>
  <div class="col-md-4"><input name="email" type="email" class="form-control" placeholder="Email (optional)"></div>
  <div class="col-md-2"><button class="btn btn-primary w-100">Add client</button></div>
</form>
{% if clients %}
<table class="table table-striped bg-white">
  <thead><tr><th>Name</th><th>Email</th><th></th></tr></thead>
  <tbody>
  {% for c in clients %}
    <tr>
      <td>{{ c.name }}</td><td>{{ c.email or "-" }}</td>
      <td class="text-end">
        <form method="post" action="{{ url_for('delete_client', client_id=c.id) }}" onsubmit="return confirm('Delete this client and their invoices?')">
          <button class="btn btn-sm btn-outline-danger">Delete</button>
        </form>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% else %}
<p class="text-muted">No clients yet. Add your first client above.</p>
{% endif %}
{% endblock %}
