{% extends "base.html" %}
{% block title %}Login · Invoice Tracker{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Welcome back</h1>
  <p>Sign in to manage your clients and invoices.</p>
  <form method="post">
    <label>Email<input name="email" type="email" required></label>
    <label>Password<input name="password" type="password" required></label>
    <button class="primary" type="submit">Login</button>
  </form>
  <p class="muted">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
</div>
{% endblock %}
