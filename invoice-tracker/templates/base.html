<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Invoice Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<nav class="nav">
  <a class="brand" href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('login') }}">Invoice Tracker</a>
  {% if current_user.is_authenticated %}
  <div class="navlinks">
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('clients') }}">Clients</a>
    <a href="{{ url_for('invoices') }}">Invoices</a>
    <span class="user">{{ current_user.name }}</span>
    <form method="post" action="{{ url_for('logout') }}"><button class="linkbtn">Logout</button></form>
  </div>
  {% endif %}
</nav>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
